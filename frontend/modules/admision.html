<div class="card border-0 shadow-sm" style="border-radius: 12px; overflow:hidden;">
    <div class="card-header border-bottom" style="background-color: #ffffff; padding: 1.5rem 2rem;">
        <h3 class="card-title" style="color: #181c32; font-size: 1.4rem; font-weight: 800; margin: 0;">Admisión de Pacientes</h3>
        <p class="text-muted" style="margin: 5px 0 0 0; font-size: 0.9rem;">Registro de nuevos usuarios en la Base de Datos.</p>
    </div>
    <div class="card-body" style="padding: 2.5rem;">
        <form id="registroForm" novalidate>
            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label fw-bolder text-dark" style="font-size: 0.85rem; text-transform:uppercase;">Nombres Completos</label>
                    <input type="text" class="form-control" style="background-color: #fff; border-color: #d8dbe5;" id="regNombre" required>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label fw-bolder text-dark" style="font-size: 0.85rem; text-transform:uppercase;">Documento Identidad</label>
                    <input type="text" class="form-control" style="background-color: #fff; border-color: #d8dbe5;" id="regDoc" required>
                </div>
                <div class="col-md-4 mb-4">
                    <label class="form-label fw-bolder text-dark" style="font-size: 0.85rem; text-transform:uppercase;">EPS Asociada</label>
                    <select class="form-control" id="regEps" style="background-color: #fff; border-color: #d8dbe5;" required>
                        <option value="">Seleccione...</option>
                        <option value="Sanitas">Sanitas</option><option value="Sura">Sura</option><option value="Compensar">Compensar</option><option value="Salud Total">Salud Total</option><option value="Nueva EPS">Nueva EPS</option>
                    </select>
                </div>
                <div class="col-md-4 mb-4">
                    <label class="form-label fw-bolder text-dark" style="font-size: 0.85rem; text-transform:uppercase;">Sede Principal</label>
                    <select class="form-control" id="regSede" style="background-color: #fff; border-color: #d8dbe5;" required>
                        <option value="">Seleccione...</option>
                        <option value="Bogotá">Bogotá</option><option value="Medellín">Medellín</option><option value="Cali">Cali</option>
                    </select>
                </div>
                <div class="col-md-4 mb-4">
                    <label class="form-label fw-bolder text-dark" style="font-size: 0.85rem; text-transform:uppercase;">Estado Financiero</label>
                    <select class="form-control" id="regEstado" style="background-color: #fff; border-color: #d8dbe5;" required>
                        <option value="Activo">Activo</option><option value="Inactivo">Inactivo</option><option value="Vencido">Vencido</option>
                    </select>
                </div>
                <div class="col-12 mt-3 text-right" style="text-align: right;">
                    <button type="submit" class="btn btn-primary" style="padding: 0.8rem 2.5rem; border-radius: 6px; font-weight: 700;">Inscribir Paciente SQL</button>
                </div>
            </div>
        </form>
    </div>
</div>
