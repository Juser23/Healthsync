<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthSync - Portal Médico</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <!-- CSS Propio -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-info {
            background-image: url('assets/images/bg_medical.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .auth-info::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(32, 201, 151, 0.85); /* Verde menta oscuro con opacidad */
            z-index: 1;
        }
        .auth-info-content {
            position: relative;
            z-index: 2;
        }
        .auth-logo {
            max-width: 250px;
            margin-bottom: 2rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <!-- Contenedor Principal de Autenticación / Landing -->
    <div class="auth-wrapper">
        <div class="auth-container border-0 shadow-lg" style="border-radius: 12px; overflow:hidden;">
            
            <!-- Sección Visual / Landing -->
            <div class="auth-info">
                <div class="auth-info-content">
                    <div style="background: white; padding: 15px 30px; border-radius: 16px; display: inline-block; margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
                        <img src="assets/images/logo.png?v=3" alt="HealthSync Logo" class="auth-logo" style="max-height: 80px; margin: 0; display: block;" onerror="this.style.display='none'">
                    </div>
                    <h1 style="font-weight: 800; letter-spacing: -1px; font-size: 3rem;">HealthSync</h1>
                    <p style="font-size: 1.15rem; opacity: 0.95; max-width: 400px; margin: 0 auto 2rem auto; line-height: 1.6;">
                        Sistema de Gestión de Información de Salud diseñado con eficiencia y precisión para la administración médica avanzada.
                    </p>
                    <p style="font-size: 0.85rem; margin-top: 3rem; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.8);">
                        Certificación ISO/IEC 25010
                    </p>
                </div>
            </div>

            <!-- Sección de Formulario de Pre-ingreso / Login -->
            <div class="auth-form-container">
                <h2 class="login-title" style="color: #181c32; font-weight: 700;">Acceso Corporativo</h2>
                <p class="login-subtitle" style="margin-bottom: 2.5rem;">Ingrese sus credenciales de directorio activo.</p>

                <form id="loginForm" novalidate onsubmit="return false;">
                    <div class="mb-3">
                        <label for="emailInput" class="form-label" style="font-weight: 600; color: #3f4254;">Correo Empresarial</label>
                        <input type="email" class="form-control" id="emailInput" placeholder="nombre@healthsync.com" style="background-color: #f5f8fa; border: 1px solid #e4e6ef; padding: 0.85rem 1rem;" required>
                    </div>

                    <div class="mb-3 mt-3">
                        <label for="passwordInput" class="form-label" style="font-weight: 600; color: #3f4254;">Contraseña</label>
                        <input type="password" class="form-control" id="passwordInput" placeholder="••••••••" style="background-color: #f5f8fa; border: 1px solid #e4e6ef; padding: 0.85rem 1rem;" required>
                    </div>

                    <div class="mb-3 mt-4" style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; color: #7e8299;">
                            <input type="checkbox" id="rememberMe"> Mantener sesión activa
                        </label>
                        <a href="#" class="text-primary" style="text-decoration: none; font-size: 0.9rem; font-weight: 600;">¿Olvidó su clave?</a>
                    </div>

                    <button type="submit" class="btn btn-modern-glow w-100" style="width: 100%; margin-top: 1.5rem; border-radius: 8px;" id="btnLogin">
                        Iniciar Sesión Segura
                    </button>
                    
                    <div class="text-center mt-4" style="font-size: 0.8rem;">
                        <span class="text-muted">Desarrollo protegido. Accesos auditados.</span>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
